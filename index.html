<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Simulator</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Main Centred Column Layout -->
  <div class="app-wrapper">
    <div class="main-column">

      <!-- Top Header -->
      <header class="top-header">
        <div>
          <h1 class="header-name" id="headerName">Aarav Sharma</h1>
          <div class="header-subtitle" id="headerSubtitle">Age 14 · Gen 1 · High school · India</div>
        </div>
        <div class="header-wealth">
          <div class="networth-val" id="headerNetWorth">$3,500</div>
          <div class="networth-lbl">Net worth</div>
          <button class="btn-link" id="btnNewLife" title="Start new life">New life</button>
        </div>
      </header>

      <!-- Horizontal Tab Bar -->
      <nav class="top-nav" aria-label="Main navigation">
        <button class="nav-tab active" data-tab="profile" type="button">
          <span class="material-symbols-outlined">person</span>
          <span>Life</span>
        </button>
        <button class="nav-tab" data-tab="education_career" type="button">
          <span class="material-symbols-outlined">school</span>
          <span>Career</span>
        </button>
        <button class="nav-tab" data-tab="business" type="button">
          <span class="material-symbols-outlined">apartment</span>
          <span>Business</span>
        </button>
        <button class="nav-tab" data-tab="finance_assets" type="button">
          <span class="material-symbols-outlined">savings</span>
          <span>Finance</span>
        </button>
        <button class="nav-tab" data-tab="relationships" type="button">
          <span class="material-symbols-outlined">diversity_3</span>
          <span>Dynasty</span>
        </button>
        <button class="nav-tab" data-tab="lifestyle" type="button">
          <span class="material-symbols-outlined">workspace_premium</span>
          <span>Elite</span>
        </button>
      </nav>

      <!-- Vitals (One-Row Grid) -->
      <div class="vitals-row">
        <div class="vital-item" id="statHealth">
          <div class="vital-top">
            <span class="vital-label">Health</span>
            <span class="vital-val stat-val-text">90%</span>
          </div>
          <div class="vital-track">
            <div class="vital-fill stat-bar-fill" style="width: 90%;"></div>
          </div>
        </div>

        <div class="vital-item" id="statHappiness">
          <div class="vital-top">
            <span class="vital-label">Happiness</span>
            <span class="vital-val stat-val-text">85%</span>
          </div>
          <div class="vital-track">
            <div class="vital-fill stat-bar-fill" style="width: 85%;"></div>
          </div>
        </div>

        <div class="vital-item" id="statSmarts">
          <div class="vital-top">
            <span class="vital-label">Smarts</span>
            <span class="vital-val stat-val-text">80%</span>
          </div>
          <div class="vital-track">
            <div class="vital-fill stat-bar-fill" style="width: 80%;"></div>
          </div>
        </div>

        <div class="vital-item" id="statLooks">
          <div class="vital-top">
            <span class="vital-label">Looks</span>
            <span class="vital-val stat-val-text">75%</span>
          </div>
          <div class="vital-track">
            <div class="vital-fill stat-bar-fill" style="width: 75%;"></div>
          </div>
        </div>

        <div class="vital-item" id="statEnergy">
          <div class="vital-top">
            <span class="vital-label">Energy</span>
            <span class="vital-val stat-val-text">100%</span>
          </div>
          <div class="vital-track">
            <div class="vital-fill stat-bar-fill" style="width: 100%;"></div>
          </div>
        </div>
      </div>

      <!-- Main Dynamic Content -->
      <main class="view-content" id="viewContent">
        <!-- Tab views render here -->
      </main>

    </div>
  </div>

  <!-- Pinned Bottom Age-Up Bar -->
  <div class="age-up-bar">
    <button class="btn-age-up" id="btnAgeUp" type="button">
      <span>Age up</span>
      <span class="age-up-next" id="ageUpNext">Age 15</span>
    </button>
  </div>

  <!-- Modal Sheet Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Modal title</h2>
        <button class="btn-close" id="modalClose" type="button">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Notification Hub -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Canonical modular runtime. The legacy monolith remains in the repository
       only as migration reference until its systems have been fully retired. -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
